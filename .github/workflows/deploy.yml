name: Deploy to Vercel

on:
  push:
    branches:
      - main

env:
  VERCEL_ORG_ID: team_zTGwYKWZiYNP6cXzPReKRjpF
  VERCEL_PROJECT_ID: prj_XVLZ2dFgbOazGUs3apblIYLYzkgx

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_zTGwYKWZiYNP6cXzPReKRjpF","projectId":"prj_XVLZ2dFgbOazGUs3apblIYLYzkgx"}' > .vercel/project.json

      - name: Deploy to production
        run: vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
