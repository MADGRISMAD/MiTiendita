# Desarrollo local completo: PostgreSQL + API + web.  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: micolmena
      POSTGRES_USER: timberpos
      POSTGRES_PASSWORD: timberpos
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timberpos -d micolmena"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 8081
      DATABASE_URL: postgres://timberpos:timberpos@db:5432/micolmena
      DATABASE_SCHEMA: timberpos
      APP_URL: ${APP_URL:-http://localhost}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost/api}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: /api/
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  pg_data:
