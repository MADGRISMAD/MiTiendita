services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 8081
      DATABASE_URI: mongodb://mongo:27017
      DATABASE_NAME: timber
      APP_URL: ${APP_URL:-http://localhost}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost/api}
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8081:8081"

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: /api/
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  mongo_data:
